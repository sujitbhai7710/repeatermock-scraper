name: Scrape Tests (Every hour)

on:
  workflow_dispatch:
    inputs:
      time_limit_minutes:
        description: 'Time limit (minutes)'
        required: false
        default: '45'
      max_tests:
        description: 'Max tests (0 = unlimited)'
        required: false
        default: '0'

  schedule:
    - cron: '10 * * * *'  # Every hour at :10

  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape.yml'
      - 'src/**'

env:
  PYTHON_VERSION: '3.12'
  PYTHONUNBUFFERED: '1'

concurrency:
  group: scrape-repeatermock
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # Needed for committing cookies back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore cached scraped data
        uses: actions/cache@v4
        with:
          path: |
            data/tests/
            data/series/
            data/progress.json
            frontend/tests/
            frontend/img/
          key: scrape-data-v1
          restore-keys: scrape-data-v1

      - name: Check 15-min gap + all-done check
        id: should-run
        run: |
          python3 << 'EOF'
          import json, time, os
          from pathlib import Path
          pf = Path("data/progress.json")
          if not pf.exists():
              print("OK: First run")
              with open(os.environ['GITHUB_ENV'], 'a') as f: f.write("SHOULD_RUN=true\n")
          else:
              p = json.loads(pf.read_text())
              last_end = p.get("last_run_end", 0)
              gap = (time.time() - last_end) / 60
              scraped = set(p.get("scraped_test_ids", []))
              failed = set(p.get("failed_test_ids", []))
              series_cache = p.get("series_cache", {})
              total = sum(len(sc.get("tests", [])) for sc in series_cache.values())
              done = sum(1 for sc in series_cache.values() for t in sc.get("tests", []) if t["id"] in scraped or t["id"] in failed)
              if total > 0 and done >= total:
                  print(f"DONE: All {total} tests scraped.")
                  with open(os.environ['GITHUB_ENV'], 'a') as f: f.write("SHOULD_RUN=false\n")
              elif gap < 15:
                  print(f"SKIP: {gap:.1f} min since last run (need 15 min)")
                  with open(os.environ['GITHUB_ENV'], 'a') as f: f.write("SHOULD_RUN=false\n")
              else:
                  print(f"OK: {gap:.0f} min gap, {done}/{total} done")
                  with open(os.environ['GITHUB_ENV'], 'a') as f: f.write("SHOULD_RUN=true\n")
          EOF

      - name: Run scraper
        if: env.SHOULD_RUN == 'true'
        run: |
          mkdir -p data/tests data/series frontend/tests frontend/img
          TIME_LIMIT="${{ github.event.inputs.time_limit_minutes }}"
          [ -z "$TIME_LIMIT" ] && TIME_LIMIT="45"
          MAX_TESTS="${{ github.event.inputs.max_tests }}"
          [ -z "$MAX_TESTS" ] && MAX_TESTS="0"
          echo "=== Scraper starting (limit: ${TIME_LIMIT}min, max: ${MAX_TESTS}) ==="
          python -m src.incremental_scrape --time-limit-minutes "$TIME_LIMIT" --max-tests "$MAX_TESTS" 2>&1 || true
          echo "=== Scraper finished ==="

      - name: Copy scraped data to frontend
        if: always()
        run: |
          mkdir -p frontend/tests
          cp data/tests/*.json frontend/tests/ 2>/dev/null || true
          echo "Copied $(ls frontend/tests/*.json 2>/dev/null | wc -l) test files"

      - name: Deploy frontend to Cloudflare Pages
        if: env.SHOULD_RUN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy frontend/ \
            --project-name=pwthor-mock-tests \
            --branch=main \
            --commit-dirty=true 2>&1 | tail -5

      - name: Commit updated cookies + progress
        if: always() && env.SHOULD_RUN == 'true'
        run: |
          git config user.name "Scraper Bot"
          git config user.email "scraper@bot.local"
          git add cookies/ data/progress.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: update cookies + progress after scrape run"
          git push 2>&1 || true

      - name: Summary
        if: always()
        run: |
          echo "## Scrape Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f data/progress.json ]; then
            python3 -c "
          import json
          with open('data/progress.json') as f: p = json.load(f)
          print(f'- Scraped: {len(p.get(\"scraped_test_ids\", []))} tests')
          print(f'- Failed: {len(p.get(\"failed_test_ids\", []))} tests')
          for url, sp in p.get('series_progress', {}).items():
              pct = (sp['scraped'] / sp['total'] * 100) if sp['total'] > 0 else 0
              print(f'- **{sp[\"name\"][:50]}**: {sp[\"scraped\"]}/{sp[\"total\"]} ({pct:.0f}%)')
          " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ github.run_id }}
          path: |
            data/tests/
            data/progress.json
            cookies/
            frontend/tests/
          retention-days: 30
