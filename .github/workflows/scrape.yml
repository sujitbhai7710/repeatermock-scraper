name: Scrape RepeaterMock Tests

on:
  # Manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      time_limit_minutes:
        description: 'Time limit per run (minutes)'
        required: false
        default: '50'
      max_tests:
        description: 'Max tests per run (0 = unlimited, use time limit)'
        required: false
        default: '0'

  # Check every 20 minutes whether we should run
  # The script itself decides whether to run based on last_run_end + 20 min gap
  schedule:
    - cron: '*/20 * * * *'

  # On push to main (for testing workflow changes only)
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape.yml'
      - 'src/**'

env:
  PYTHON_VERSION: '3.12'

# Concurrency: only one scrape run at a time
# If a new run is triggered while one is running, the new one waits
concurrency:
  group: scrape-repeatermock
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Hard limit: 60 minutes (50 min work + buffer)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # ─── Restore cookies from cache (persisted across runs) ──────────────
      # This is the KEY: cookies are saved to cache after each run,
      # so the next run uses the rotated refresh token automatically.
      # The user only needs to set the REPEATERMOCK_COOKIES_JSON secret ONCE.

      - name: Restore cached cookies
        id: cookie-cache
        uses: actions/cache@v4
        with:
          path: |
            data/cookies.json
            data/progress.json
            data/tests/
            data/series/
          key: repeatermock-scrape-state-v1
          restore-keys: |
            repeatermock-scrape-state-v1

      - name: Create .env from secret (initial cookies — only used if no cache)
        run: |
          mkdir -p data/tests data/series

          # If cached cookies exist, use them (they have the latest refresh token)
          if [ -f data/cookies.json ]; then
            echo "✓ Found cached cookies from previous run"
            python3 -c "
            import json
            with open('data/cookies.json') as f:
                data = json.load(f)
            print(f'  Cookies: {len(data[\"cookies\"])}')
            for c in data['cookies']:
                print(f'    - {c[\"name\"]}: {c[\"value\"][:30]}...')
            "
            # Also write to .env for the scraper to pick up via env vars
            python3 -c "
            import json
            with open('data/cookies.json') as f:
                data = json.load(f)
            with open('.env', 'w') as f:
                f.write(f'REPEATERMOCK_COOKIES_JSON={json.dumps(data[\"cookies\"])}\n')
            "
          else
            # No cache — use the secret (first run ever, or cache expired)
            echo "No cached cookies. Using REPEATERMOCK_COOKIES_JSON secret..."
            if [ -z "${{ secrets.REPEATERMOCK_COOKIES_JSON }}" ]; then
              echo "ERROR: REPEATERMOCK_COOKIES_JSON secret is not set"
              echo "Go to Settings → Secrets and variables → Actions → New repository secret"
              echo "Name: REPEATERMOCK_COOKIES_JSON"
              echo "Value: JSON cookie array from browser"
              exit 1
            fi
            printf 'REPEATERMOCK_COOKIES_JSON=%s\n' '${{ secrets.REPEATERMOCK_COOKIES_JSON }}' > .env
            echo "✓ .env created from secret"
          fi

          # Verify cookies are valid JSON
          python3 -c "
          import json, os
          from dotenv import load_dotenv
          load_dotenv('.env')
          raw = os.environ.get('REPEATERMOCK_COOKIES_JSON', '')
          if raw:
              cookies = json.loads(raw)
              print(f'  ✓ {len(cookies)} cookies loaded')
              has_refresh = any(c['name'] == 'refreshToken' for c in cookies)
              print(f'  Has refreshToken: {has_refresh}')
          else:
              print('  ✗ No cookies found')
              exit(1)
          "

      - name: Check if should run (respect 20-min gap between runs)
        id: should-run
        run: |
          python3 << 'PYEOF'
          import json, time, os
          from pathlib import Path

          progress_file = Path("data/progress.json")
          if progress_file.exists():
              progress = json.loads(progress_file.read_text())
              last_end = progress.get("last_run_end", 0)
              gap = time.time() - last_end
              gap_minutes = gap / 60

              if gap_minutes < 20:
                  print(f"⏭ Skipping: only {gap_minutes:.1f} minutes since last run (need 20 min gap)")
                  print(f"  Last run ended: {time.strftime('%H:%M:%S UTC', time.gmtime(last_end))}")
                  print(f"  Next eligible: {time.strftime('%H:%M:%S UTC', time.gmtime(last_end + 1200))}")
                  with open(os.environ['GITHUB_ENV'], 'a') as f:
                      f.write("SHOULD_RUN=false\n")
              else:
                  print(f"✓ {gap_minutes:.1f} minutes since last run — proceeding")
                  with open(os.environ['GITHUB_ENV'], 'a') as f:
                      f.write("SHOULD_RUN=true\n")
          else:
              print("✓ No previous progress — first run, proceeding")
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write("SHOULD_RUN=true\n")
          PYEOF

      - name: Run incremental scraper
        if: env.SHOULD_RUN == 'true'
        run: |
          TIME_LIMIT="${{ github.event.inputs.time_limit_minutes }}"
          [ -z "$TIME_LIMIT" ] && TIME_LIMIT="50"
          MAX_TESTS="${{ github.event.inputs.max_tests }}"
          [ -z "$MAX_TESTS" ] && MAX_TESTS="0"

          echo "Starting incremental scraper..."
          echo "  Time limit: $TIME_LIMIT minutes"
          echo "  Max tests: $MAX_TESTS"

          python -m src.incremental_scrape \
            --time-limit-minutes "$TIME_LIMIT" \
            --max-tests "$MAX_TESTS"

      - name: Show progress summary
        if: always()
        run: |
          echo "## Scrape Progress" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/progress.json ]; then
            python3 -c "
            import json, time
            with open('data/progress.json') as f:
                p = json.load(f)
            print(f'### Summary')
            print(f'- Total scraped: {len(p.get(\"scraped_test_ids\", []))} tests')
            print(f'- Total failed: {len(p.get(\"failed_test_ids\", []))} tests')
            print(f'- Total questions: {p.get(\"total_scraped\", 0)}')
            print()
            print(f'### Series Progress')
            for url, sp in p.get('series_progress', {}).items():
                print(f'- **{sp[\"name\"][:50]}**: {sp[\"scraped\"]}/{sp[\"total\"]} scraped, {sp[\"pending\"]} pending')
            print()
            last = p.get('run_history', [{}])[-1] if p.get('run_history') else {}
            if last:
                print(f'### Last Run')
                print(f'- Tests scraped: {last.get(\"tests_scraped\", 0)}')
                print(f'- Questions scraped: {last.get(\"questions_scraped\", 0)}')
                print(f'- Duration: {last.get(\"time_minutes\", 0):.1f} min')
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "No progress file found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Count scraped test files
        if: always()
        run: |
          TEST_COUNT=$(find data/tests -name "*.json" 2>/dev/null | wc -l)
          echo "Total test files in data/tests/: $TEST_COUNT"
          if [ -f data/progress.json ]; then
            python3 -c "
            import json
            with open('data/progress.json') as f:
                p = json.load(f)
            print(f'Scraped test IDs in progress: {len(p.get(\"scraped_test_ids\", []))}')
            print(f'Failed test IDs: {len(p.get(\"failed_test_ids\", []))}')
            "
          fi

      # Note: cookies.json + progress.json + tests/ are automatically saved
      # to the cache by actions/cache (defined in the restore step above)
      # The cache persists for 7 days and is updated after each run.

      - name: Upload scraped data as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-tests-${{ github.run_id }}
          path: |
            data/tests/
            data/series/
            data/progress.json
            data/cookies.json
          retention-days: 30
