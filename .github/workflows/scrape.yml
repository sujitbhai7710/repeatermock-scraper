name: Scrape Tests (Every 70 min)

on:
  workflow_dispatch:
    inputs:
      time_limit_minutes:
        description: 'Time limit (minutes)'
        required: false
        default: '45'
      max_tests:
        description: 'Max tests (0 = unlimited)'
        required: false
        default: '0'

  schedule:
    - cron: '10 */1 * * *'  # Every hour at :10 min (70-min gap via concurrency + gap check)

  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape.yml'
      - 'src/**'

env:
  PYTHON_VERSION: '3.12'
  PYTHONUNBUFFERED: '1'

# NEVER run two scrape workflows at the same time
concurrency:
  group: scrape-repeatermock
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore cached state
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            data/cookies.json
            data/progress.json
            data/submit_format.json
            data/tests/
            data/series/
            frontend/tests/
            frontend/img/
          key: scrape-state-v3
          restore-keys: scrape-state-v3

      - name: Setup cookies (multi-account)
        env:
          COOKIES_SECRET_1: ${{ secrets.REPEATERMOCK_COOKIES_JSON_1 }}
          COOKIES_SECRET_2: ${{ secrets.REPEATERMOCK_COOKIES_JSON_2 }}
        run: |
          mkdir -p data/tests data/series frontend/tests frontend/img

          if [ -f data/cookies.json ]; then
            echo "✓ Using cached cookies from previous run"
          else
            echo "Setting up cookies from account 1 secret..."
            python3 -c "
          import os, json
          secret = os.environ.get('COOKIES_SECRET_1', '')
          if not secret:
              print('ERROR: COOKIES_SECRET_1 is empty'); exit(1)
          cookies = json.loads(secret)
          for c in cookies:
              ss = c.get('sameSite', 'Lax')
              if ss not in ('Strict', 'Lax', 'None'): c['sameSite'] = 'Lax'
              c.pop('id', None); c.pop('storeId', None); c.pop('hostOnly', None); c.pop('session', None)
          with open('data/cookies.json', 'w') as f:
              json.dump({'cookies': cookies, 'simple': {c['name']: c['value'] for c in cookies}, 'saved_at': 0}, f, indent=2)
          print(f'✓ Wrote {len(cookies)} cookies to data/cookies.json')
          "
          fi

          # Write both accounts to a file the scraper can read for fallback
          python3 -c "
          import os, json
          accounts = {}
          for i, key in enumerate(['COOKIES_SECRET_1', 'COOKIES_SECRET_2'], 1):
              val = os.environ.get(key, '')
              if val:
                  accounts[f'REPEATERMOCK_COOKIES_JSON_{i}'] = val
          with open('data/cookie_accounts.json', 'w') as f:
              json.dump(accounts, f)
          print(f'✓ Wrote {len(accounts)} cookie accounts to data/cookie_accounts.json')
          "

          # Also set as env var for the scraper (it reads from env first, then file)

      - name: Check 15-min gap + all-done check
        id: should-run
        run: |
          python3 << 'EOF'
          import json, time, os
          from pathlib import Path

          pf = Path("data/progress.json")
          if not pf.exists():
              print("OK: First run")
              os.environ["SHOULD_RUN"] = "true"
              with open(os.environ['GITHUB_ENV'], 'a') as f: f.write("SHOULD_RUN=true\n")
          else:
              p = json.loads(pf.read_text())
              last_end = p.get("last_run_end", 0)
              gap = (time.time() - last_end) / 60

              # Check if all tests are done
              scraped = set(p.get("scraped_test_ids", []))
              failed = set(p.get("failed_test_ids", []))
              series_cache = p.get("series_cache", {})
              
              total_tests = 0
              done_tests = 0
              for url, sc in series_cache.items():
                  tests = sc.get("tests", [])
                  total_tests += len(tests)
                  done_tests += sum(1 for t in tests if t["id"] in scraped or t["id"] in failed)

              if total_tests > 0 and done_tests >= total_tests:
                  print(f"DONE: All {total_tests} tests scraped. Skipping.")
                  with open(os.environ['GITHUB_ENV'], 'a') as f: f.write("SHOULD_RUN=false\n")
              elif gap < 15:
                  print(f"SKIP: Only {gap:.1f} min since last run (need 15 min)")
                  with open(os.environ['GITHUB_ENV'], 'a') as f: f.write("SHOULD_RUN=false\n")
              else:
                  print(f"OK: {gap:.1f} min gap, {done_tests}/{total_tests} tests done")
                  with open(os.environ['GITHUB_ENV'], 'a') as f: f.write("SHOULD_RUN=true\n")
          EOF

      - name: Run scraper (questions + submit + answers + solutions + analysis + images)
        if: env.SHOULD_RUN == 'true'
        run: |
          TIME_LIMIT="${{ github.event.inputs.time_limit_minutes }}"
          [ -z "$TIME_LIMIT" ] && TIME_LIMIT="45"
          MAX_TESTS="${{ github.event.inputs.max_tests }}"
          [ -z "$MAX_TESTS" ] && MAX_TESTS="0"

          echo "=== Scraper starting ==="
          echo "  Time limit: $TIME_LIMIT min, Max tests: $MAX_TESTS"

          python -m src.incremental_scrape \
            --time-limit-minutes "$TIME_LIMIT" \
            --max-tests "$MAX_TESTS" \
            2>&1 || {
              echo "=== Scraper error ==="
              python3 -c "
          import json, os
          from dotenv import load_dotenv
          load_dotenv('.env')
          raw = os.environ.get('REPEATERMOCK_COOKIES_JSON', '')
          if raw:
              cookies = json.loads(raw)
              print(f'Cookies: {len(cookies)}')
              for c in cookies:
                  if c['name'] in ('accessToken', 'refreshToken'):
                      print(f'  {c[\"name\"]}: {c[\"value\"][:40]}...')
              print('If auth failed: update REPEATERMOCK_COOKIES_JSON secret with fresh cookies')
              "
              exit 1
            }

      - name: Copy scraped data to frontend
        if: always()
        run: |
          mkdir -p frontend/tests
          cp data/tests/*.json frontend/tests/ 2>/dev/null || true
          echo "Copied $(ls frontend/tests/*.json 2>/dev/null | wc -l) test files to frontend"

      - name: Deploy frontend to Cloudflare Pages
        if: success() && env.SHOULD_RUN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Deploying to Cloudflare Pages ==="
          npx wrangler pages deploy frontend/ \
            --project-name=pwthor-mock-tests \
            --branch=main \
            --commit-dirty=true \
            2>&1 | tail -5
          echo "✓ Frontend deployed"

      - name: Summary
        if: always()
        run: |
          echo "## Scrape Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f data/progress.json ]; then
            python3 << 'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open('data/progress.json') as f: p = json.load(f)
          scraped = len(p.get('scraped_test_ids', []))
          failed = len(p.get('failed_test_ids', []))
          print(f"- Scraped: {scraped} tests")
          print(f"- Failed: {failed} tests")
          print(f"\n### Series Progress")
          for url, sp in p.get('series_progress', {}).items():
              pct = (sp['scraped'] / sp['total'] * 100) if sp['total'] > 0 else 0
              print(f"- **{sp['name'][:50]}**: {sp['scraped']}/{sp['total']} ({pct:.0f}%)")
          last = p.get('run_history', [{}])[-1] if p.get('run_history') else {}
          if last:
              print(f"\n### Last Run")
              print(f"- Tests: {last.get('tests_scraped', 0)}")
              print(f"- Questions: {last.get('questions_scraped', 0)}")
              print(f"- Duration: {last.get('time_minutes', 0):.1f} min")
          EOF
          fi
          TEST_COUNT=$(ls frontend/tests/*.json 2>/dev/null | wc -l)
          echo "- Frontend test files: $TEST_COUNT" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ github.run_id }}
          path: |
            data/tests/
            data/progress.json
            data/cookies.json
            data/submit_format.json
            frontend/tests/
            frontend/img/
          retention-days: 30
