name: Scrape Tests (Every hour)

on:
  workflow_dispatch:
    inputs:
      time_limit_minutes:
        description: 'Time limit (minutes)'
        required: false
        default: '45'
      max_tests:
        description: 'Max tests (0 = unlimited)'
        required: false
        default: '0'
      reset_partial:
        description: 'Reset partial/failed tests to retry (true/false)'
        required: false
        default: 'false'

  # Schedule disabled — user runs locally. Re-enable by uncommenting the line below.
  # schedule:
  #   - cron: '10 * * * *'  # Every hour at :10

  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape.yml'
      - 'src/**'

env:
  PYTHON_VERSION: '3.12'
  PYTHONUNBUFFERED: '1'

concurrency:
  group: scrape-repeatermock
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Setup Node for wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Restore cached scraped data
        uses: actions/cache@v4
        with:
          path: |
            data/tests/
            data/series/
            data/progress.json
            data/submit_format.json
            frontend/tests/
            frontend/img/
          key: scrape-data-v2
          restore-keys: scrape-data-v2

      - name: Optional reset of partial/failed tests
        if: github.event.inputs.reset_partial == 'true'
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path
          pf = Path("data/progress.json")
          if pf.exists():
              p = json.loads(pf.read_text())
              partial = p.get("partial_test_ids", [])
              failed = p.get("failed_test_ids", [])
              print(f"Resetting {len(partial)} partial + {len(failed)} failed tests to retry")
              p["partial_test_ids"] = []
              p["failed_test_ids"] = []
              # Also clear tests_status for these
              ts = p.get("tests_status", {})
              for tid in partial + failed:
                  ts.pop(tid, None)
              p["tests_status"] = ts
              pf.write_text(json.dumps(p, indent=2))
              print("✓ Reset done")
          EOF

      - name: Check 15-min gap + all-done check
        id: should-run
        run: |
          python3 << 'EOF'
          import json, time, os
          from pathlib import Path
          pf = Path("data/progress.json")
          if not pf.exists():
              print("OK: First run")
              with open(os.environ['GITHUB_ENV'], 'a') as f: f.write("SHOULD_RUN=true\n")
          else:
              p = json.loads(pf.read_text())
              last_end = p.get("last_run_end", 0)
              gap = (time.time() - last_end) / 60
              series_cache = p.get("series_cache", {})
              total = sum(len(sc.get("tests", [])) for sc in series_cache.values())
              scraped_set = set(p.get("scraped_test_ids", []))
              # All-done check: every test in every series is in scraped_set
              all_done = total > 0 and all(
                  t["id"] in scraped_set
                  for sc in series_cache.values()
                  for t in sc.get("tests", [])
              )
              if all_done:
                  print(f"DONE: All {total} tests fully scraped.")
                  with open(os.environ['GITHUB_ENV'], 'a') as f: f.write("SHOULD_RUN=false\n")
              elif gap < 15:
                  print(f"SKIP: {gap:.1f} min since last run (need 15 min)")
                  with open(os.environ['GITHUB_ENV'], 'a') as f: f.write("SHOULD_RUN=false\n")
              else:
                  print(f"OK: {gap:.0f} min gap, scraped {len(scraped_set)}/{total}")
                  with open(os.environ['GITHUB_ENV'], 'a') as f: f.write("SHOULD_RUN=true\n")
          EOF

      - name: Run scraper
        if: env.SHOULD_RUN == 'true'
        run: |
          mkdir -p data/tests data/series frontend/tests frontend/img
          TIME_LIMIT="${{ github.event.inputs.time_limit_minutes }}"
          [ -z "$TIME_LIMIT" ] && TIME_LIMIT="45"
          MAX_TESTS="${{ github.event.inputs.max_tests }}"
          [ -z "$MAX_TESTS" ] && MAX_TESTS="0"
          echo "=== Scraper starting (limit: ${TIME_LIMIT}min, max: ${MAX_TESTS}) ==="
          python -m src.incremental_scrape --time-limit-minutes "$TIME_LIMIT" --max-tests "$MAX_TESTS" 2>&1 || true
          echo "=== Scraper finished ==="

      - name: Copy scraped data to frontend + generate index.json
        if: always()
        run: |
          mkdir -p frontend/tests frontend/img
          # Copy fully-scraped test files (scraper only saves complete ones)
          cp data/tests/*.json frontend/tests/ 2>/dev/null || true
          # Copy image dirs from data/img/* to frontend/img/* (preserving series subdirs)
          if [ -d data/img ]; then
            cp -r data/img/* frontend/img/ 2>/dev/null || true
          fi
          # Generate /tests/index.json — list of all fully-scraped tests
          # (used by frontend to render series cards dynamically)
          python3 << 'EOF'
          import json
          from pathlib import Path
          tests_dir = Path("frontend/tests")
          tests_dir.mkdir(parents=True, exist_ok=True)
          index = []
          for f in sorted(tests_dir.glob("*.json")):
              if f.name == "index.json":
                  continue
              try:
                  t = json.loads(f.read_text())
                  # Only include fully-scraped tests (sanity check)
                  if not (t.get("has_questions") and t.get("has_answers") and t.get("has_analysis")):
                      continue
                  index.append({
                      "test_id": t.get("test_id"),
                      "title": t.get("title", "Untitled"),
                      "series_name": t.get("series_name", ""),
                      "series_url": t.get("series_url", ""),
                      "platform": t.get("platform", ""),
                      "slug": t.get("slug", ""),
                      "section": t.get("section", ""),
                      "subsection": t.get("subsection", ""),
                      "duration_minutes": t.get("duration_minutes", 60),
                      "total_marks": t.get("total_marks", 200),
                      "question_count": len(t.get("questions", [])),
                      "is_free": t.get("is_free", True),
                      "scraped_at": t.get("scraped_at", ""),
                  })
              except Exception as e:
                  print(f"  ⚠ Error reading {f.name}: {e}")
          (tests_dir / "index.json").write_text(json.dumps(index, indent=2, ensure_ascii=False))
          print(f"✓ Generated /tests/index.json with {len(index)} fully-scraped tests")
          EOF
          echo "Copied $(ls frontend/tests/*.json 2>/dev/null | wc -l) test files to frontend"

      - name: Sync progress to D1
        if: always() && env.SHOULD_RUN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠ CLOUDFLARE_API_TOKEN secret not set — skipping D1 sync"
          elif [ ! -f worker/wrangler.toml ] || ! grep -q 'database_id = "[a-f0-9-]' worker/wrangler.toml; then
            echo "⚠ D1 database not yet configured in worker/wrangler.toml"
            echo "  Run the 'One-time Setup' workflow first to create D1 + configure worker"
          else
            echo "=== Syncing progress to D1 ==="
            python -m src.update_d1 2>&1 || echo "⚠ D1 sync failed (non-fatal)"
          fi

      - name: Deploy frontend to Cloudflare Pages
        if: env.SHOULD_RUN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy frontend/ \
            --project-name=pwthor-mock-tests \
            --branch=main \
            --commit-dirty=true 2>&1 | tail -5

      - name: Commit updated cookies + progress
        if: always() && env.SHOULD_RUN == 'true'
        run: |
          git config user.name "Scraper Bot"
          git config user.email "scraper@bot.local"
          git add cookies/ data/progress.json data/submit_format.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: update cookies + progress after scrape run [skip ci]"
          git push 2>&1 || true

      - name: Summary
        if: always()
        run: |
          echo "## Scrape Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f data/progress.json ]; then
            python3 -c "
          import json
          with open('data/progress.json') as f: p = json.load(f)
          scraped = len(p.get('scraped_test_ids', []))
          partial = len(p.get('partial_test_ids', []))
          failed = len(p.get('failed_test_ids', []))
          print(f'- **Fully scraped**: {scraped} tests')
          print(f'- **Partial** (missing answers/analysis): {partial} tests')
          print(f'- **Failed** (no questions): {failed} tests')
          print()
          print('### Series Progress')
          for url, sp in p.get('series_progress', {}).items():
              total = sp.get('total', 0)
              sc = sp.get('scraped', 0)
              pct = (sc / total * 100) if total > 0 else 0
              bar = '█' * int(pct/5) + '░' * (20 - int(pct/5))
              print(f'- \`{bar}\` {sp.get(\"name\",\"\")[:50]}: {sc}/{total} ({pct:.0f}%)')
          " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ github.run_id }}
          path: |
            data/tests/
            data/progress.json
            cookies/
            frontend/tests/
          retention-days: 30
