name: One-time Setup (Cloudflare D1 + Worker)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm setup'
        required: true
        default: 'no'
      skip_worker_deploy:
        description: 'Skip worker deploy (D1 only)'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.12'

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "✗ Confirm input must be 'yes' to run setup"
            exit 1
          fi
          echo "✓ Confirmed"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Create D1 database + apply schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/setup_cloudflare.py

      - name: Deploy worker (skip if requested)
        if: github.event.inputs.skip_worker_deploy != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: bash scripts/deploy_worker.sh

      - name: Commit updated wrangler.toml
        run: |
          git config user.name "Setup Bot"
          git config user.email "setup@bot.local"
          git add worker/wrangler.toml 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Setup: configure D1 database ID in wrangler.toml [skip ci]"
          git push 2>&1 || true

      - name: Show summary
        run: |
          echo "## Cloudflare Setup Complete" >> $GITHUB_STEP_SUMMARY
          if [ -f worker/.env ]; then
            DB_ID=$(grep DATABASE_ID worker/.env | cut -d= -f2)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**D1 Database ID**: \`$DB_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Worker dashboard: https://repeatermock-dashboard.<your-subdomain>.workers.dev" >> $GITHUB_STEP_SUMMARY
            echo "Admin password: \`BloggingTest@7\`" >> $GITHUB_STEP_SUMMARY
          fi
